interpretation_limits:
  - Probe coordinates are tiling spans; midpoint distances are quantitative nominal genomic offsets, not single-base probe positions.
  - The cut is a sequence-anchored nominal SpCas9 cleavage boundary, not a tracked image object.
  - No cut-site trajectory is constructed or analyzed.
  - With only two sites, a distance slope is algebraically a Site1-versus-Site2 contrast and cannot identify a continuous distance law.
  - Imaging separation is 2D projected locus geometry, not broken-end distance or chromatin contour length.
