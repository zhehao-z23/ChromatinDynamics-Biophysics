interpretation_limits:
  - The offsets use tiling-interval midpoints and a sequence-anchored nominal cleavage boundary.
  - There are only two fixed offset levels; any regression slope is algebraically a Site1-versus-Site2 contrast, not an identified continuous distance gradient.
  - Site identity, imaging channel, local chromatin context, localization quality, and nominal offset are inseparable in this dataset.
  - No time-varying cut coordinate or cut-site trajectory is constructed or analyzed.
  - Results are exploratory technical-acquisition summaries, not biological-replicate inference.
